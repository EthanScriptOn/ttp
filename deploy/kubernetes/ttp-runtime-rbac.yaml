apiVersion: v1
kind: Namespace
metadata:
  name: ttp-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ttp-runtime
  namespace: ttp-system
---
# Replace change-me with one actual target namespace before applying.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ttp-runtime
  namespace: change-me
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ttp-runtime
  namespace: change-me
subjects:
  - kind: ServiceAccount
    name: ttp-runtime
    namespace: ttp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ttp-runtime
---
# Read-only cluster resources are intentionally separate from namespaced write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ttp-runtime-observe
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ttp-runtime-observe
subjects:
  - kind: ServiceAccount
    name: ttp-runtime
    namespace: ttp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ttp-runtime-observe
